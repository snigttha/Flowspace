

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - FlowSpace</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f5fb;
            color: #292638;
            padding: 30px 20px;
        }

        .settings-container {
            max-width: 650px;
            margin: 0 auto;
        }

        .settings-card {
            background: white;
            padding: 24px;
            margin: 20px 0;
            border-radius: 14px;
            box-shadow: 0 3px 15px #25204410;
        }

        .settings-card h2 { margin-top: 0; }

        .settings-card label {
            display: block;
            margin: 15px 0 6px;
        }

        .settings-card input {
            box-sizing: border-box;
            width: 100%;
            padding: 11px;
            border: 1px solid #d8d3e5;
            border-radius: 8px;
        }

        .settings-card button, .back-link {
            display: inline-block;
            margin-top: 16px;
            padding: 11px 17px;
            border: none;
            border-radius: 8px;
            background: #7160a8;
            color: white;
            cursor: pointer;
            text-decoration: none;
        }

        .message {
            margin-top: 12px;
            overflow-wrap: anywhere;
        }

        .danger { background: #a74757 !important; }
        .muted { color: #706b7e; }
    </style>
</head>
<body>
    <div class="settings-container">
        <a class="back-link" href="dashboard.html">← Dashboard</a>

        <h1>Account Settings</h1>
        <p class="muted">Manage your FlowSpace account.</p>
        <p id="accountInfo">Loading account details...</p>

        <section class="settings-card">
            <h2>Change Name</h2>
            <form id="nameForm">
                <label for="name">Your name</label>
                <input id="name" name="name" required maxlength="100">
                <button type="submit">Save Name</button>
            </form>
            <p class="message" id="nameMessage" role="status"></p>
        </section>

        <section class="settings-card">
            <h2>Change Password</h2>
            <form id="passwordForm">
                <label for="currentPassword">Current password</label>
                <input id="currentPassword" name="currentPassword"
                       type="password" required>

                <label for="newPassword">New password</label>
                <input id="newPassword" name="newPassword"
                       type="password" minlength="8" required>

                <button type="submit">Update Password</button>
            </form>
            <p class="message" id="passwordMessage" role="status"></p>
        </section>

        <button id="logoutButton" class="danger">Log Out</button>
        <p id="logoutMessage" class="message" role="status"></p>
    </div>

    <script src="js/settings.js"></script>
</body>
</html>
