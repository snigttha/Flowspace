<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notes - FlowSpace</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/wellness.css"></head>
<body data-page="notes">
<div class="shell"><nav class="side" id="nav"></nav><main>
<h1>Notes</h1>
<form id="f" class="card" novalidate><input type="hidden" name="id">
<div class="grid g2"><label>Title<input name="title" data-v="required|max:100"><small class="err" data-for="title"></small></label>
<label>Category<select name="category"><option>General</option><option>Study</option><option>Personal</option><option>Ideas</option><option>Health</option></select></label></div>
<label>Note<textarea name="content" data-v="required|max:2000"></textarea><small class="err" data-for="content"></small></label>
<button class="btn">Add note</button></form>
<div class="bar"><input id="q" type="search" placeholder="Search notes" aria-label="Search notes"><select id="cat" aria-label="Filter by category" style="max-width:180px"><option value="">All categories</option><option>General</option><option>Study</option><option>Personal</option><option>Ideas</option><option>Health</option></select></div>
<div id="list"></div>
</main></div>
<script src="js/validate.js"></script><script src="js/app.js"></script><script src="js/search.js"></script></body></html>
